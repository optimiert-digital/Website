<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seite nicht gefunden – optimiert.digital</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    .nf { min-height: calc(100vh - var(--header-h)); display: grid; align-items: center; padding-block: clamp(3rem, 9vw, 7rem); }
    .nf-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(2rem, 6vw, 5rem); align-items: center; }
    .nf h1 { font-size: clamp(2.4rem, 8vw, 5rem); line-height: .98; letter-spacing: -.05em; margin-bottom: 1.25rem; }
    .nf h1 span { color: var(--blue); }
    .nf p { max-width: 30rem; color: var(--muted-light); font-size: 1.15rem; margin-bottom: 2rem; }
    .nf-mark { display: grid; place-items: center; }
    .nf-mark svg { width: 100%; max-width: 16rem; aspect-ratio: 1; opacity: .95; }
    @media (max-width: 760px) {
      .nf-grid { grid-template-columns: 1fr; }
      .nf-mark { justify-items: start; order: -1; }
      .nf-mark svg { max-width: 6rem; }
      .nf .btn { width: 100%; padding-block: 1.05rem; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="logo-mark" viewBox="200 170 900 900">
      <path fill="#fff" d="M826.9 316.6A352 352 0 0 0 343.1 800.4L404.8 738.7A268 268 0 0 1 765.2 378.3Z"/>
      <path fill="#fff" d="M943.9 433.6A352 352 0 0 1 460.1 917.4L521.8 855.7A268 268 0 0 0 882.2 495.3Z"/>
      <path fill="#0a47ff" d="M228 1055Q613 581 1077 186Q692 660 228 1055Z"/>
    </symbol>
  </svg>

  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="/" aria-label="optimiert.digital, zur Startseite">
        <svg class="logo-mark" aria-hidden="true"><use href="#logo-mark"/></svg>
        <span class="wordmark"><b>optimiert</b>.digital</span>
      </a>
    </div>
  </header>

  <main class="nf">
    <div class="wrap nf-grid">
      <div>
        <h1>Diese Seite gibt es nicht. <span>Noch nicht.</span></h1>
        <p>Der Link ist vielleicht veraltet oder die Adresse wurde falsch eingegeben. Auf der Startseite findest du alles Wichtige.</p>
        <a class="btn btn-primary btn-xl" href="/">Zur Startseite</a>
      </div>
      <div class="nf-mark" aria-hidden="true">
        <svg><use href="#logo-mark"/></svg>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap copyright">
      © 2026 optimiert.digital · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a>
    </div>
  </footer>
</body>
</html>
